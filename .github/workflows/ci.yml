name: Code CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
          install: true

      - name: Lint
        run: pnpm lint-ci

      - name: Build code
        run: pnpm build

      - name: Typecheck
        run: pnpm test-types

      - name: Test
        run: pnpm test

      - name: Zip the extension
        run: pnpm zip

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
          install: true

      - name: Install Playwright's Chromium
        run: pnpm --filter @devlanes/e2e exec playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: pnpm e2e

      - name: Keep the screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
